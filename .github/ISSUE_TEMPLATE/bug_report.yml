name: Bug report
description: Something behaved differently from how it is documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The three commands below tell me more than a description usually can, so please paste their output.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: I asked Claude to edit a governed file and the gate allowed it without a read.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `kmem doctor`
      render: shell
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of `kmem report`
      description: Only if the issue involves the gate. It shows what was logged and where.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: "`kmem --version`, and your operating system."
      placeholder: kmem 0.1.1, Ubuntu 24.04
    validations:
      required: true
